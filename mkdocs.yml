site_name: 聲光技術筆記
site_description: 音響（PA）與舞台燈光技術筆記 · Live sound (PA) and stage lighting notes
# After you create the GitHub repo, set these two lines (optional but recommended):
site_url: https://pal.dante.tw/
# repo_url: https://github.com/<your-user>/<your-repo>

docs_dir: docs
strict: true

theme:
  name: material
  language: zh-TW
  font: false            # no Google Fonts request; uses system fonts
  features:
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle: { icon: material/weather-sunny, name: Light mode }

extra_css:
  - assets/css/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          name: 中文
          default: true
          build: true
          site_name: 聲光技術筆記
          theme:
            language: zh-TW
        - locale: en
          name: English
          build: true
          site_name: Sound & Lighting Notes
          theme:
            language: en
          nav_translations:
            首頁: Home
            音響系統（PA）: PA System
            混音機: Mixers
            燈光系統: Lighting System
            燈光前級（Console）: Lighting Consoles

nav:
  - 首頁: index.md
  - 音響系統（PA）:
      - pa/index.md
      - pa/overview.md
      - pa/sources-microphones.md
      - pa/signal-processors.md
      - pa/amplifiers-speakers.md
      - 混音機:
          - pa/mixers/index.md
          - pa/mixers/bx-2442.md
          - pa/mixers/emx-5000-12.md
          - pa/mixers/gl2200-432.md
          - pa/mixers/lm12.md
          - pa/mixers/mx122.md
          - pa/mixers/vx-16.md
          - pa/mixers/rm-124.md
          - pa/mixers/action-20-02.md
      - pa/system-setup.md
      - pa/troubleshooting.md
      - pa/cables-connectors.md
  - 燈光系統:
      - lighting/index.md
      - lighting/electrical-basics.md
      - lighting/power-safety-multimeter.md
      - lighting/rigging-system-diagrams.md
      - lighting/dimmers.md
      - 燈光前級（Console）:
          - lighting/consoles/index.md
          - lighting/consoles/touchlight-c1201-c1202.md
          - lighting/consoles/c-24x.md
          - lighting/consoles/strand-mx.md
          - lighting/consoles/dmx-console-led-par.md
          - lighting/consoles/kk256a-dmx-tables.md
      - lighting/fixtures.md
      - lighting/optics.md
      - lighting/stage-lighting-design.md
      - lighting/load-in-strike.md
